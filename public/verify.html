<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Membership | NDUB Computer Club</title>
    <meta name="description" content="Check that an NDUB Computer Club membership card is real.">
    <link rel="icon" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="site-header"></header>

    <main>
        <section class="page-head">
            <div class="container">
                <h1>Verify a Membership Card</h1>
                <p>Scan the QR code on a card, or type its club ID below.</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <form id="verify-form" class="card form-card" novalidate>
                    <div class="field">
                        <label for="club_id">Club ID</label>
                        <div class="verify-row">
                            <input id="club_id" name="club_id" required maxlength="30" placeholder="e.g. NDUBCC-001" autocomplete="off">
                            <button class="btn" type="submit">Check</button>
                        </div>
                    </div>
                </form>

                <div id="result" class="form-card" style="margin-top: 16px;"></div>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/common.js"></script>
    <script src="js/pages/verify.js"></script>
</body>
</html>
