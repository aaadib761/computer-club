<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | NDUB Computer Club</title>
    <meta name="description" content="Photos from NDUB Computer Club seminars, workshops, contests and fests.">
    <link rel="icon" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="site-header"></header>

    <main>
        <section class="page-head">
            <div class="container">
                <h1>Gallery</h1>
                <p>Moments from our seminars, workshops, contests and fests.</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="filter-bar">
                    <input type="search" id="search" placeholder="Search by event or caption…" aria-label="Search photos">
                    <select id="year-filter" aria-label="Filter by year"><option value="">All years</option></select>
                </div>
                <div id="category-chips" class="chips" role="group" aria-label="Filter by category"></div>
                <p id="result-count" class="meta hidden" role="status"></p>
                <div id="albums">
                    <div class="loading">Loading photos…</div>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/common.js"></script>
    <script src="js/lightbox.js"></script>
    <script src="js/pages/gallery.js"></script>
</body>
</html>
