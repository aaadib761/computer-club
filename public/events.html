<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | NDUB Computer Club</title>
    <link rel="icon" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="site-header"></header>

    <main>
        <section class="page-head">
            <div class="container">
                <h1>Events</h1>
                <p>Workshops, contests, seminars and meetups.</p>
                <p class="subscribe-line">📅 <a id="subscribe-link" href="/calendar.ics">Subscribe to the club calendar</a>
                    <span class="meta">so new events appear in your calendar app automatically.</span></p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="filter-bar">
                    <input type="search" id="search" placeholder="Search events, speakers, venues…" aria-label="Search events">
                    <select id="year-filter" aria-label="Filter by year"><option value="">All years</option></select>
                </div>
                <div id="category-chips" class="chips" role="group" aria-label="Filter by category"></div>
                <p id="result-count" class="meta hidden" role="status"></p>
                <h2>Upcoming</h2>
                <div id="upcoming" class="grid grid-2">
                    <div class="loading">Loading events…</div>
                </div>
            </div>
        </section>

        <section class="section" style="padding-top: 0;">
            <div class="container">
                <h2>Past Events</h2>
                <div id="past" class="grid grid-2">
                    <div class="loading">Loading events…</div>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/common.js"></script>
    <script src="js/pages/events.js"></script>
</body>
</html>
