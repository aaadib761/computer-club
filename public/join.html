<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join | NDUB Computer Club</title>
    <link rel="icon" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="site-header"></header>

    <main>
        <section class="page-head">
            <div class="container">
                <h1>Join the Club</h1>
                <p>Fill in the form and our committee will review your request.</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <form id="join-form" class="card form-card" novalidate>
                    <div class="form-message hidden" role="status"></div>

                    <div class="field">
                        <label for="name">Full name</label>
                        <input id="name" name="name" type="text" required maxlength="100" autocomplete="name">
                    </div>
                    <div class="field">
                        <label for="student_id">Student ID</label>
                        <input id="student_id" name="student_id" required minlength="3" maxlength="30" pattern="[A-Za-z0-9\-]{3,30}" autocomplete="off">
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label for="department">Department</label>
                            <input id="department" name="department" required maxlength="60" list="department-options" placeholder="e.g. CSE" autocomplete="off">
                            <datalist id="department-options"></datalist>
                        </div>
                        <div class="field">
                            <label for="batch">Batch</label>
                            <input id="batch" name="batch" required maxlength="30" placeholder="e.g. 22" autocomplete="off">
                        </div>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" required maxlength="150" autocomplete="email">
                    </div>
                    <div class="field">
                        <label for="phone">Phone <small>(optional)</small></label>
                        <input id="phone" name="phone" type="tel" maxlength="30" autocomplete="tel">
                    </div>
                    <div class="field">
                        <label for="reason">Why do you want to join? <small>(optional)</small></label>
                        <textarea id="reason" name="reason" maxlength="1000"></textarea>
                    </div>

                    <button class="btn" type="submit">Send Request</button>
                </form>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/common.js"></script>
    <script src="js/pages/join.js"></script>
</body>
</html>
