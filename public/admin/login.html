<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | NDUB Computer Club</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="../images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
    <main class="login-wrap">
        <div class="card login-card">
            <img src="../images/logo.png" alt="NDUB Computer Club logo">
            <h1 style="font-size: 1.5rem;">Admin Login</h1>
            <p class="meta">NDUB Computer Club</p>

            <form id="login-form">
                <div class="form-message hidden" role="status"></div>
                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" name="username" required autocomplete="username" autofocus>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required autocomplete="current-password">
                </div>
                <button class="btn" type="submit">Log in</button>
            </form>

            <!-- step 2, only for admins who turned on 2-step login -->
            <form id="code-form" class="hidden" method="post" novalidate>
                <div class="form-message hidden" role="status"></div>
                <p class="meta" style="text-align: left;">Open your authenticator app and type the 6-digit code for <b>NDUB Computer Club</b>.</p>
                <div class="field">
                    <label for="code">Code</label>
                    <input id="code" name="code" required inputmode="numeric" autocomplete="one-time-code" maxlength="20" class="code-input" placeholder="123 456">
                    <p class="hint">Lost your phone? Type one of your recovery codes instead (like abcd-efgh-jkmn).</p>
                </div>
                <button class="btn" type="submit">Verify</button>
                <p style="margin: 12px 0 0;"><button type="button" class="link-button" id="code-back">&larr; Use a different account</button></p>
            </form>
            <p style="margin: 16px 0 0;"><a href="../index.html">&larr; Back to website</a></p>
        </div>
    </main>

    <script src="../js/common.js"></script>
    <script src="admin.js"></script>
    <script src="pages/login.js"></script>
</body>
</html>
