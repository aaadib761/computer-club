<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | NDUB Computer Club</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="../images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
    <main class="login-wrap">
        <div class="card login-card">
            <img src="../images/logo.png" alt="NDUB Computer Club logo">
            <h1 style="font-size: 1.5rem;">Admin Login</h1>
            <p class="meta">NDUB Computer Club</p>

            <form id="login-form">
                <div class="form-message hidden" role="status"></div>
                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" name="username" required autocomplete="username" autofocus>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required autocomplete="current-password">
                </div>
                <button class="btn" type="submit">Log in</button>
            </form>
            <p style="margin: 16px 0 0;"><a href="../index.html">&larr; Back to website</a></p>
        </div>
    </main>

    <script src="../js/common.js"></script>
    <script src="admin.js"></script>
    <script>
        if (currentAdmin()) location.href = 'index.html';

        const form = document.getElementById('login-form');
        const message = form.querySelector('.form-message');

        if (new URLSearchParams(location.search).get('reason') === 'expired') {
            showMessage(message, 'error', 'Your session ended. Please log in again.');
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const { username, password } = readForm(form);
            if (!username || !password) return showMessage(message, 'error', 'Please enter your username and password.');

            submitting(form, async () => {
                const { token } = await api('/admin/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password }),
                });
                storageSet(TOKEN_KEY, token);
                storageSet(NAME_KEY, username);
                location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
