<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Requests | NDUB Admin</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="../images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
    <main class="admin-main">
        <h1>Join Requests</h1>
        <p class="page-sub">Approving a request adds the person to Members automatically.</p>

        <div class="toolbar">
            <select id="filter" aria-label="Which requests">
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
                <option value="all">All</option>
            </select>
        </div>
        <div id="list" class="list"><div class="loading">Loading…</div></div>
    </main>

    <script src="../js/common.js"></script>
    <script src="admin.js"></script>
    <script src="pages/requests.js"></script>
</body>
</html>
