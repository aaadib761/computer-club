<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | NDUB Admin</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="../images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
    <main class="admin-main">
        <h1>Events</h1>
        <p class="page-sub">Events show on the public website. Open an event to take attendance and add gallery photos.</p>

        <div class="toolbar">
            <select id="filter" aria-label="Which events">
                <option value="upcoming">Upcoming events</option>
                <option value="past">Past events</option>
                <option value="all">All events</option>
            </select>
            <button class="btn" id="add-btn">+ Add event</button>
        </div>
        <div id="list" class="list"><div class="loading">Loading events…</div></div>
    </main>

    <dialog class="modal" id="event-dialog">
        <form id="event-form" novalidate>
            <h2 id="event-dialog-title">Add event</h2>
            <div class="form-message hidden" role="status"></div>
            <div class="field">
                <label for="e-title">Title</label>
                <input id="e-title" name="title" required maxlength="120">
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="e-date">Date</label>
                    <input id="e-date" name="date" type="date" required>
                </div>
                <div class="field">
                    <label for="e-time">Time <small>(optional)</small></label>
                    <input id="e-time" name="time" type="time">
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="e-category">Category <small>(optional)</small></label>
                    <select id="e-category" name="category">
                        <option value="">— Choose —</option>
                        <option>Seminar</option>
                        <option>Workshop</option>
                        <option>Contest</option>
                        <option>Fest</option>
                        <option>Picnic</option>
                        <option>Meetup</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="field">
                    <label for="e-duration">Duration <small>(optional)</small></label>
                    <input id="e-duration" name="duration" maxlength="30" placeholder="e.g. 1.5 hours">
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="e-speaker">Resource person <small>(optional)</small></label>
                    <input id="e-speaker" name="speaker" maxlength="100" placeholder="Speaker's name">
                </div>
                <div class="field">
                    <label for="e-speaker-title">Their title <small>(optional)</small></label>
                    <input id="e-speaker-title" name="speaker_title" maxlength="120" placeholder="e.g. Lecturer, Dept. of CSE">
                </div>
            </div>
            <div class="field">
                <label for="e-venue">Venue <small>(optional)</small></label>
                <input id="e-venue" name="venue" maxlength="120" placeholder="e.g. NDUB Open Space">
            </div>
            <div class="field-row">
                <label class="check" style="margin: 30px 0 0;">
                    <input type="checkbox" name="registration_open" id="e-registration">
                    <span>Members can register online</span>
                </label>
                <div class="field">
                    <label for="e-capacity">Seat limit <small>(optional)</small></label>
                    <input id="e-capacity" name="capacity" type="number" min="1" max="10000" step="1" placeholder="No limit">
                </div>
            </div>
            <div class="field">
                <label for="e-description">Description <small>(optional)</small></label>
                <textarea id="e-description" name="description" maxlength="3000"></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-ghost" data-close>Cancel</button>
                <button type="submit" class="btn">Save</button>
            </div>
        </form>
    </dialog>

    <script src="../js/common.js"></script>
    <script src="admin.js"></script>
    <script src="pages/events.js"></script>
</body>
</html>
