<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members | NDUB Admin</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="../images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
    <main class="admin-main">
        <h1>Members</h1>
        <p class="page-sub">Give a member a position and rank to show them on the public Committee page.</p>

        <div class="toolbar">
            <input type="search" id="search" placeholder="Search name, email, position…" aria-label="Search members">
            <div class="btn-group">
                <div class="view-switch" role="group" aria-label="View">
                    <button type="button" data-view="list" aria-pressed="true">☰ List</button>
                    <button type="button" data-view="grid" aria-pressed="false">▦ Grid</button>
                </div>
                <button class="btn" id="add-btn">+ Add member</button>
            </div>
        </div>
        <div id="list" class="list"><div class="loading">Loading members…</div></div>
    </main>

    <dialog class="modal" id="member-dialog">
        <form id="member-form" novalidate>
            <h2 id="member-dialog-title">Add member</h2>
            <div class="form-message hidden" role="status"></div>
            <div class="field">
                <label for="m-name">Full name</label>
                <input id="m-name" name="name" required maxlength="100">
            </div>
            <div class="field">
                <label for="m-email">Email</label>
                <input id="m-email" name="email" type="email" required maxlength="150">
            </div>
            <div class="field">
                <label for="m-phone">Phone <small>(optional)</small></label>
                <input id="m-phone" name="phone" type="tel" maxlength="30">
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="m-position">Position <small>(optional)</small></label>
                    <input id="m-position" name="position" maxlength="60" placeholder="e.g. President">
                </div>
                <div class="field">
                    <label for="m-rank">Rank <small>(optional)</small></label>
                    <input id="m-rank" name="position_rank" type="number" min="1" step="1" placeholder="e.g. 1">
                </div>
            </div>
            <p class="hint" style="margin-top:-8px;">Rank 1 shows first on the Committee page. Leave rank empty to hide someone from it.</p>
            <div class="modal-actions">
                <button type="button" class="btn btn-ghost" data-close>Cancel</button>
                <button type="submit" class="btn">Save</button>
            </div>
        </form>
    </dialog>

    <dialog class="modal" id="photo-dialog">
        <form id="photo-form">
            <h2>Photo for <span id="photo-name"></span></h2>
            <div class="form-message hidden" role="status"></div>
            <div id="photo-current" style="margin-bottom: 16px;"></div>
            <div class="field">
                <label for="photo-file">Choose a new photo <small>(JPG, PNG or WEBP, max 5 MB)</small></label>
                <input id="photo-file" name="photo" type="file" accept="image/jpeg,image/png,image/webp" required>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-danger" id="photo-remove">Remove photo</button>
                <span style="flex:1"></span>
                <button type="button" class="btn btn-ghost" data-close>Cancel</button>
                <button type="submit" class="btn">Upload</button>
            </div>
        </form>
    </dialog>

    <script src="../js/common.js"></script>
    <script src="admin.js"></script>
    <script src="pages/members.js"></script>
</body>
</html>
