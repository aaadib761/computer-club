<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event | NDUB Admin</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="../images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
    <main class="admin-main">
        <p style="margin: 0 0 8px;"><a href="events.html">&larr; All events</a></p>
        <h1 id="title">Loading…</h1>
        <p class="page-sub" id="subtitle"></p>

        <section>
            <div class="section-title">
                <h2>Attendance</h2>
                <span class="meta" id="summary"></span>
            </div>
            <p class="meta">Click a status to mark a member. Click the same status again to clear it.</p>
            <div class="toolbar">
                <input type="search" id="search" placeholder="Search members…" aria-label="Search members">
            </div>
            <div id="attendance" class="list"><div class="loading">Loading members…</div></div>
        </section>

        <section style="margin-top: 36px;">
            <div class="section-title"><h2>Gallery photos</h2></div>
            <form id="photo-form" class="card" style="margin-bottom: 16px;">
                <div class="form-message hidden" role="status"></div>
                <div class="field-row">
                    <div class="field">
                        <label for="photos">Photos <small>(you can pick several)</small></label>
                        <input id="photos" name="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple required>
                    </div>
                    <div class="field">
                        <label for="caption">Caption <small>(optional, for all)</small></label>
                        <input id="caption" name="caption" maxlength="150">
                    </div>
                </div>
                <p class="hint" style="margin: -6px 0 12px;">Photos get the "NDUB Computer Club" watermark automatically.</p>
                <button class="btn" type="submit">Upload</button>
            </form>
            <div id="photo-grid" class="photo-grid"></div>
        </section>
    </main>

    <script src="../js/common.js"></script>
    <script src="admin.js"></script>
    <script src="pages/event.js"></script>
</body>
</html>
